civicroad.jwt.secret=635266556A586E3272357538782F413F4428472B4B6250645367566B59703373
civicroad.jwt.expiration-ms=86400000

# External AI Service
civicroad.ai.service-url=http://localhost:5000

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
